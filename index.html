<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAE Price Finder</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#15171a; --muted:#6b7280; --line:#e5e7eb; --accent:#0f766e; --best:#ecfdf5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --ink:#eef0f3; --muted:#9aa3af; --line:#2a2f37; --accent:#2dd4bf; --best:#11302b; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  form { display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; font-size:1rem; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); }
  button { padding:12px 18px; font-size:1rem; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .bar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin:20px 0 10px; color:var(--muted); font-size:.9rem; }
  select { padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:10px; margin-bottom:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .stat b { display:block; font-size:1.2rem; color:var(--ink); }
  .list { display:grid; gap:10px; }
  .row { display:grid; grid-template-columns: 64px 1fr auto; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; }
  .row.best { background:var(--best); border-color:var(--accent); }
  .row img { width:64px; height:64px; object-fit:contain; border-radius:8px; background:#fff; }
  .title { font-weight:600; font-size:.95rem; }
  .meta { color:var(--muted); font-size:.85rem; margin-top:2px; }
  .price { text-align:right; font-weight:700; font-size:1.1rem; white-space:nowrap; }
  .price s { display:block; font-weight:400; font-size:.8rem; color:var(--muted); }
  .price a { display:block; font-size:.8rem; font-weight:500; color:var(--accent); margin-top:4px; }
  .msg { padding:20px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>UAE Price Finder</h1>
  <p class="sub">Type a product name, SKU or model number to compare live prices across UAE online stores.</p>

  <form id="f">
    <input id="q" placeholder="e.g. iPhone 17 Pro 256GB, or MQ2L3AE/A" autocomplete="off" required>
    <button id="go">Search</button>
  </form>

  <div id="out"></div>
</main>

<script>
  // 👉 STEP: paste your Cloudflare Worker URL here
  const WORKER_URL = "https://uae-prices.biancacoelho910.workers.dev/";

  const $ = (id) => document.getElementById(id);
  let all = [];

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = $("q").value.trim();
    if (!q) return;
    $("go").disabled = true;
    $("out").innerHTML = '<div class="msg">Checking UAE stores…</div>';
    try {
      const res = await fetch(`${WORKER_URL}/?q=${encodeURIComponent(q)}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      all = data.results.filter(r => r.value != null).sort((a, b) => a.value - b.value);
      render(data.fetchedAt);
    } catch (err) {
      $("out").innerHTML = `<div class="msg">Something went wrong: ${err.message}</div>`;
    } finally {
      $("go").disabled = false;
    }
  });

  function render(fetchedAt) {
    if (!all.length) { $("out").innerHTML = '<div class="msg">No UAE listings found. Try a broader name.</div>'; return; }
    const stores = [...new Set(all.map(r => r.store))].sort();
    const prices = all.map(r => r.value);
    const fmt = (n) => "AED " + n.toLocaleString("en-AE", { maximumFractionDigits: 2 });
    $("out").innerHTML = `
      <div class="bar">
        <span>${all.length} listings · ${stores.length} stores · updated ${new Date(fetchedAt).toLocaleString()}</span>
        <select id="store"><option value="">All stores</option>${stores.map(s => `<option>${esc(s)}</option>`).join("")}</select>
      </div>
      <div class="stats">
        <div class="stat">Lowest<b>${fmt(Math.min(...prices))}</b></div>
        <div class="stat">Highest<b>${fmt(Math.max(...prices))}</b></div>
        <div class="stat">Average<b>${fmt(prices.reduce((a,b)=>a+b,0)/prices.length)}</b></div>
      </div>
      <div class="list" id="list"></div>`;
    $("store").addEventListener("change", drawList);
    drawList();
  }

  function drawList() {
    const pick = $("store").value;
    const rows = all.filter(r => !pick || r.store === pick);
    $("list").innerHTML = rows.map((r, i) => `
      <div class="row ${i === 0 && !pick ? "best" : ""}">
        <img src="${r.image || ""}" alt="">
        <div>
          <div class="title">${esc(r.title)}</div>
          <div class="meta">${esc(r.store)}${r.delivery ? " · " + esc(r.delivery) : ""}${r.rating ? " · ★ " + r.rating : ""}</div>
        </div>
        <div class="price">${esc(r.price)}${r.oldPrice ? `<s>${esc(r.oldPrice)}</s>` : ""}<a href="${r.link}" target="_blank" rel="noopener">View →</a></div>
      </div>`).join("");
  }

  function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
</script>
</body>
</html>
